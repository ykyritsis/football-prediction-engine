[workspace]
resolver = "2"
members = ["crates/football_ai", "crates/football_sandbox"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.dev.package."*"]
opt-level = 2

# The simulation is CPU-heavy; keep it optimised in dev/test builds too
# (debug assertions stay on).
[profile.dev.package.football_ai]
opt-level = 3
