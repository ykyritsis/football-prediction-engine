name: Publish Touchline website

on:
  pull_request:
    branches: ["claude/great-cerf-lgzlzb"]
  push:
    branches: ["claude/great-cerf-lgzlzb"]
    paths:
      - "crates/predictor/**"
      - "data/**"
      - "tools/**"
      - "api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: touchline-publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup update stable --no-self-update && rustup default stable
      - name: Check the prediction engine
        run: cargo test --locked -p predictor
      - name: Check browser simulation
        run: node --test crates/predictor/web/*.test.cjs
      - name: Build the saved-data website
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node tools/build_website.cjs
      - name: Package the deployable folder
        run: |
          rm -rf deploy-out && mkdir deploy-out
          cp -r dist/. deploy-out/
          mkdir -p deploy-out/api && cp -r api/. deploy-out/api/
      - uses: actions/upload-artifact@v4
        with:
          name: touchline-site
          path: deploy-out

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: touchline-site
          path: site
      - name: Push the site to the deploy branch for Vercel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site
          git init -q -b deploy
          git config user.name "touchline-bot"
          git config user.email "touchline-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:deploy
