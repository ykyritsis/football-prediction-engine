<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101d35" />
    <title>Touchline — Football intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700;750;800&display=swap"
      rel="stylesheet"
    />
    <style>
      __APP_CSS__
    </style>
  </head>
  <body>
    <header class="masthead">
      <a class="wordmark" href="#" aria-label="Touchline home"
        ><svg width="27" height="30" viewBox="0 0 27 30" aria-hidden="true">
          <path d="M2 2h23v6h-8v20h-7V8H2Z" fill="currentColor" />
          <path d="M22 13h4v15h-4Z" fill="#f05b46" /></svg
        >TOUCHLINE</a
      ><span class="masthead-sub">FOOTBALL INTELLIGENCE</span>
      <div class="masthead-date" id="snapshot"></div>
    </header>
    <nav class="topnav" aria-label="Main navigation">
      <button data-view="matches" class="active">Matches</button
      ><button data-view="table">Tables</button
      ><button data-view="clubs">Teams</button
      ><button data-view="players">Players</button
      ><button data-view="simulator">Simulator</button
      ><button data-view="history">Model results</button
      ><button data-view="seasons">Seasons & history</button
      ><button data-view="about">About the data</button>
    </nav>
    <div class="shell">
      <aside class="sidebar">
        <div class="sidebar-label">COMPETITIONS</div>
        <div id="competitions"></div>
        <div class="sidebar-note">
          <span class="status-dot"></span> Match predictions<br /><small
            >90 minutes · pre-match model</small
          >
        </div>
      </aside>
      <main>
        <label class="mobile-competition field">Competition<select id="mobileCompetition" aria-label="Choose competition"></select></label>
        <div class="page-heading">
          <div>
            <div class="eyebrow" id="eyebrow">MATCH CENTRE</div>
            <h1 id="title">Football, in focus.</h1>
            <p id="subtitle">
              Fixtures, form and match predictions across world football.
            </p>
          </div>
          <div class="season-label">2026/27<span>SEASON</span></div>
        </div>
        <div
          class="club-strip"
          id="clubStrip"
          aria-label="Clubs in this competition"
        ></div>
        <div class="content-toolbar">
          <div id="viewTools"></div>
          <label class="search"
            ><svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              aria-hidden="true"
            >
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="m16 16 5 5" /></svg
            ><input
              id="search"
              type="search"
              aria-label="Search clubs or players"
              placeholder="Search clubs or players"
          /></label>
        </div>
        <div id="freshness"></div>
        <div id="content"></div>
        <footer>
          <span
            >TOUCHLINE <span class="footer-divider">/</span> Independent
            football analysis</span
          ><button data-view="about">Data sources & methodology ↗</button>
        </footer>
      </main>
    </div>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button data-view="matches"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h2m4 0h2"/></svg><span>Matches</span></button>
      <button data-view="clubs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 3v6c0 4-5 8-8 9-3-1-8-5-8-9V6Z"/><path d="m8 12 3 3 5-6"/></svg><span>Teams</span></button>
      <button data-view="players"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21v-3a8 8 0 0 1 16 0v3"/></svg><span>Players</span></button>
      <button data-view="simulator"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 10 6-10 6Z"/><path d="M4 4v16"/></svg><span>Simulator</span></button>
      <button id="moreNavigation" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg><span>More</span></button>
    </nav>
    <dialog id="navigationDialog" aria-label="More football sections">
      <button class="dialog-close" aria-label="Close navigation">×</button>
      <div class="eyebrow">EXPLORE TOUCHLINE</div><h2>More football.</h2>
      <div class="navigation-links"><button data-view="table"><strong>League tables</strong><span>Points, positions and form →</span></button><button data-view="history"><strong>Model results</strong><span>Predictions against final scores →</span></button><button data-view="seasons"><strong>Seasons & history</strong><span>Explore the results archive →</span></button><button data-view="about"><strong>About the data</strong><span>Sources and how predictions work →</span></button></div>
    </dialog>
    <dialog id="matchDialog" aria-label="Match prediction">
      <button class="dialog-close" aria-label="Close match details">×</button>
      <div id="matchDetail"></div>
    </dialog>
    <dialog id="playerDialog" aria-label="Player profile">
      <button class="dialog-close" aria-label="Close player details">×</button>
      <div id="playerDetail"></div>
    </dialog>
    <script id="data" type="application/json">
      __PREDICTOR_DATA__
    </script>
    <script>
      __SIMULATION_CODE__;
    </script>
    <script>
      __PRESENTATION_CODE__;
      __EXPERIENCE_CODE__;
      __BROADCAST_CODE__;
      __HISTORY_CODE__;
      __PROFILE_CODE__;
      __APP_JS__;
    </script>
  </body>
</html>
